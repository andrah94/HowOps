name: Node CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [backend, frontend, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node
              - name: Install Expo CLI (mobile only)
      if: matrix.workspace == 'mobile'
      run: npm install -g expo-cli
-version: 18
          
      - run: npm install -w ${{ matrix.workspace }}
      - run: npm --workspace ${{ matrix.workspace }} run lint
      - run: npm --workspace ${{ matrix.workspace }} run test --if-present
